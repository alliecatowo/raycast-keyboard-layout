# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directories:
  - /
  - /assets/helper
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  # typescript-eslint does not support TypeScript 7 yet (open:
  # https://github.com/typescript-eslint/typescript-eslint/issues/10940).
  - dependency-name: typescript
    versions:
    - ">=7"
  # Raycast runs extensions on Node 22; keep the types on the runtime's major.
  - dependency-name: "@types/node"
    update-types:
    - version-update:semver-major
